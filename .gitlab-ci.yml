# Build the Strapi Docker image and push it to this project's GitLab Container
# Registry whenever a git tag is pushed (e.g. `git push origin v0.5.0`).
#
# Image tags produced:
#   $CI_REGISTRY_IMAGE:<git-tag>   e.g. :v0.5.0 (use this to pin a deploy)
#   $CI_REGISTRY_IMAGE:latest      always points at the newest tag build

stages:
  - build

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  tags:
    - docker-build
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # Reuse layers from the previous release if one exists (first run: no-op).
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true
    - >
      docker build --pull
      --cache-from "$CI_REGISTRY_IMAGE:latest"
      --build-arg BUILDKIT_INLINE_CACHE=1
      --label org.opencontainers.image.version="$CI_COMMIT_TAG"
      --label org.opencontainers.image.revision="$CI_COMMIT_SHA"
      --label org.opencontainers.image.source="$CI_PROJECT_URL"
      -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      -t "$CI_REGISTRY_IMAGE:latest"
      .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
